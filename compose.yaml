# Local demo stack — for education only, not clinical use.
name: ai_diag

services:
  orthanc:
    image: orthancteam/orthanc:latest    
    restart: unless-stopped
    ports:
      - "127.0.0.1:8042:8042"   #REST API + web UI
      - "127.0.0.1:4242:4242"   #DICOM Protocol
    volumes:
      - orthanc-db:/var/lib/orthanc/db
    environment:
      ORTHANC__NAME: "ai_diag"
      ORTHANC__REGISTERED_USERS: |
        {"demo": "demo"}
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    image: ai_diag-worker:dev
    init: true
    restart: unless-stopped
    depends_on:
      orthanc:
        condition: service_started
      api:
        condition: service_healthy
    environment:
      ORTHANC_URL: "http://orthanc:8042"
      ORTHANC_USER: "demo"
      ORTHANC_PASSWORD: "demo"
      RESULTS_URL: "http://api:8080/api/results"
      WORKER_STATE: "/state/cursor.json"
    volumes:
      - worker-state:/state

  api:
    build:
      context: services/api
    image: ai_diag-api:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      API_DB: "/data/api.db"
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD", "/api", "-healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s

  stub-api:   
    image: ai_diag-worker:dev
    init: true
    pull_policy: never
    profiles: ["stub"]
    command: ["python", "-m", "src.serve.stub_api"]
    environment:
      STUB_HOST: "0.0.0.0"
      STUB_FAIL_FIRST: "1"
    volumes:
      - ./data/interim/stub_api_docker:/app/data/interim/stub_api

volumes:
  orthanc-db:
  worker-state:
  api-data: