# Serves the built viewer and forwards /api to the Go API: one origin for the browser,
# same idea as the Vite dev proxy. Replaces the image's /etc/nginx/conf.d/default.conf.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Docker's embedded DNS; with a variable in proxy_pass, "api" is resolved at request
    # time, so a recreated api container (new IP) is found without restarting nginx,
    # and nginx starts even while the api is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Safety net: if the DNS server itself does not answer, give up after 2 s (default 30 s).
    resolver_timeout 2s;

    # Hashed build files: new content = new file name, so they can be cached "forever".
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        # The api IP is cached for up to 10 s (valid=10s). If the api stops inside that
        # window, nginx connects to a dead address that never answers (default wait 60 s).
        # Fail after 2 s instead, so the page shows an error rather than hanging.
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    # The app shell: always revalidated, so a new build shows up on the next reload.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /index.html;
    }
}
