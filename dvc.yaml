stages:
  resize:
    cmd: python -m src.data.resize_images
    deps:
      - src/data/resize_images.py
      - src/data/nih.py
      - data/raw/nih
    params:
      - resize.size
    outs:
      - data/processed/images_resized
  make_splits:
    cmd: python -m src.data.make_splits
    deps:
      - src/data/make_splits.py
      - src/data/nih.py
      - data/raw/nih/Data_Entry_2017.csv
      - data/raw/nih/test_list.txt
    params:
      - splits.val_frac
      - splits.seed
    outs:
      - data/processed/splits.csv

  train:
    cmd: python -m src.train.train
    deps:
      - src/train/train.py
      - src/train/weights.py
      - src/models/classifier.py
      - src/data/dataset.py
      - src/data/nih.py
      - src/data/make_splits.py      
      - src/data/resize_images.py    
      - data/processed/splits.csv
      - data/processed/images_resized
    params:
      - train                        
    outs:
      - models/densenet121_best.pt
    metrics:
      - reports/train_metrics.json:
          cache: false
    plots:
      - reports/train_history.csv:
          cache: false
          x: epoch
          y: val_mean_auroc
  predict:
    cmd: python -m src.evaluation.predict
    deps:
      - src/evaluation/predict.py
      - src/train/train.py           
      - src/models/classifier.py
      - src/data/dataset.py
      - src/data/nih.py
      - src/data/make_splits.py       
      - src/data/resize_images.py   
      - models/densenet121_best.pt    
      - data/processed/splits.csv
      - data/processed/images_resized
    outs:
      - data/processed/predictions
  eval_metrics:
    cmd: python -m src.evaluation.metrics
    deps:
      - src/evaluation/metrics.py
      - src/evaluation/predict.py      # IMAGE_COL, PRED_DIR
      - src/data/nih.py                # LABELS, PROJECT_ROOT
      - src/data/make_splits.py        # OUT_PATH (splits CSV path)
      - data/processed/predictions     # links this stage to predict's output
      - data/processed/splits.csv      # labels + metadata
    metrics:
      - reports/eval_metrics.json:
          cache: false
  thresholds:
    cmd: python -m src.evaluation.thresholds
    deps:
      - src/evaluation/thresholds.py
      - src/evaluation/metrics.py      # load_predictions
      - src/evaluation/predict.py      # IMAGE_COL, PRED_DIR
      - src/data/nih.py                # LABELS, PROJECT_ROOT
      - src/data/make_splits.py        # OUT_PATH (splits CSV path)
      - data/processed/predictions
      - data/processed/splits.csv
    outs:
      - reports/thresholds.json:
          cache: false
  subgroups:
    cmd: python -m src.evaluation.subgroups
    deps:
      - src/evaluation/subgroups.py
      - src/evaluation/metrics.py      # load_predictions, per_class_auroc
      - src/evaluation/predict.py      # IMAGE_COL, PRED_DIR
      - src/data/nih.py                # LABELS, PROJECT_ROOT
      - src/data/make_splits.py        # OUT_PATH (splits CSV path)
      - data/processed/predictions
      - data/processed/splits.csv
    outs:
      - reports/subgroup_metrics.json:
          cache: false
  localization:
    cmd: python -m src.explain.localization
    deps:
      - src/explain/localization.py
      - src/explain/gradcam.py         # gradcam, load_model, load_bboxes, ORIG_SIZE
      - src/evaluation/thresholds.py   # THRESHOLDS path
      - src/evaluation/predict.py      # IMAGE_COL
      - src/train/train.py             # CHECKPOINT (via load_model), get_device
      - src/models/classifier.py
      - src/data/dataset.py
      - src/data/nih.py                # LABELS, NIH_DIR, PROJECT_ROOT
      - src/data/make_splits.py        # OUT_PATH (dataset's default splits CSV)
      - src/data/resize_images.py      # IMAGE_DIR
      - models/densenet121_best.pt     # links this stage to train's output
      - reports/thresholds.json        # links this stage to the thresholds stage
      - data/raw/nih/BBox_List_2017.csv
      - data/processed/splits.csv
      - data/processed/images_resized
    outs:
      - reports/gradcam_localization.json:
          cache: false
      - reports/gradcam_localization_boxes.csv:
          cache: false